; OGL3D - stereo 3D for OpenGL games (opengl32.dll proxy)
; Put opengl32.dll (x64 or x86 to match the game exe) and this file next to the game exe.

[Stereo]
enable = 1
; percent of max_separation (Ctrl+F3 / Ctrl+F4)
separation = 50
; clip-space x offset per eye at infinity when separation = 100
max_separation = 0.1
; view depth that sits on the screen plane (Ctrl+F5 / Ctrl+F6), or auto: follows the scene so the
; nearest content sits at the screen (Ctrl+F2 toggles; adjusting by hand switches to manual)
convergence = auto
; auto: how far the nearest content may come out of the screen, in % of the separation
auto_popout = 0
; auto: how quickly convergence follows scene changes (1 = default, 2 = faster, 0.5 = calmer)
auto_speed = 1
; auto: where it last settled (written by the wrapper); the next launch starts from it
auto_start =
swap_eyes = 0
; auto (SR weaving when an SR display is available, else half SBS), sr, sbs, tab, left, right
output = auto
; keep geometry with clip w == 1 (2D, HUD, full-screen passes) at screen depth
mono_w1 = 1
; per-eye projection matrix for fixed-function / non-injected draws (compatibility contexts)
fixed_function = 1
; for purely orthographic 2D/2.5D games: flat geometry gets depth from its layer z (0 = off)
ortho_depth = 0
; layer z (clip space, -1..1) that sits on the screen plane in ortho depth mode
ortho_convergence = 0

[Flat]
; layered depth for flat 2D games (sprites drawn with clip w == 1): a geometry shader gives every
; sprite its own depth. Background/overlay planes slope back towards the top of the screen, sprites
; stand at the depth of their bottom edge (feet), later scissor/viewport batches (UI) stay at the screen.
enable = 0
; feet: adventure games - background slopes back, sprites stand at their bottom edge (AGS). Fixed-function
;   draws (Machinarium): parts stacked on each other stand together, a piece of the background drawn again
;   keeps its slope, a screen-wide picture drawn after the sprites (inventory bar) stays at the screen
; order: side-scrollers - layers get depth from the order they are drawn in (first = far, last = screen)
rule = feet
; depth at the top of the screen, in units of the separation (bottom of the screen = 0)
depth_top = 1
; depth that sits on the screen plane (0 = bottom of the screen)
depth_screen = 0
; quads at least this wide (in NDC, 2 = the whole screen width) are planes (background layers,
; overlays) that slope back; narrower ones are sprites standing at their bottom edge
plane_size = 1.2
; ... and at least this high (0 = any height). Adventure games with wide walk-behinds (AGS): 1.8
plane_height = 0
; also a plane: a quad at least this high (NDC, 2 = the screen height) whatever its width; 0 = off.
; Pictures drawn in pieces (Samorost 2: a tentacle as an upper and a lower piece) need it, or each
; piece stands at its own bottom edge and a line shows where pieces meet
plane_tall = 0
; sprites never come nearer than this depth (moves with depth_screen: relative to the screen plane at 0)
sprite_min = -0.25
; draws from this batch on stay at screen depth (AGS: 0 = room, 1 = overlays/GUI, 2 = cursor); 0 = off
screen_batch = 1
; off-screen layer caches (a low-resolution target the scene is drawn into first, then scaled to the
; screen) are made stereo; how far a layer in one moves, relative to the screen (0 = auto)
cache_scale = 0
; rule order: a layer is a run of draws with the same program and textures (texture), or every draw
; call (draw: Unity draws each parallax plane separately, often from one atlas)
group = texture
; rule order: depth by place in drawing order, 1 = even; below 1 spreads the first (far) layers more
order_curve = 1
; silhouette depth: in pictures drawn by these programs (hashes, comma separated), dark pixels come
; nearer than the picture (comic panels made of one image or video); empty = off
silhouette =
; fragment shader varying (vec2) and sampler of the picture
silhouette_uv = texcoordOut
silhouette_tex = texture1
; how much nearer, as a part of depth_top
silhouette_depth = 0.3
; brightness (max of r, g, b) below which a pixel counts as dark
silhouette_threshold = 0.15

[Inject]
; rewrite vertex shaders: main() -> s3d_main0() + stereo offset
enable = 1
; refuse glProgramBinary so cached shader binaries are rebuilt from (rewritten) source
block_program_binary = 1
; write original and rewritten vertex shaders to OGL3D_shaders\
dump_shaders = 0
; rewrite ARB / NV assembly vertex programs (Cg arbvp1, PSSG engine) for the stereo offset
arb_programs = 1
; NVIDIA Cg games: cgGLGetLatestProfile answers the GLSL profiles (1); off by default (Rocketbirds turned white)
cg_glsl = 0
; arguments appended to the game's command line before it reads it, for a renderer switch the store
; does not pass (Machinarium: -ogl, otherwise it draws with Direct3D 12)
add_args =

[Targets]
; render targets with the window's aspect ratio (within tolerance) and at least this wide are stereo
min_width = 64
aspect_tolerance = 0.03

[SR]
; frames between weaving and display (eye-position prediction)
latency_frames = 1
; give the weaver the game window (0 = assume full screen)
weaver_hwnd = 1

[Display]
; make the game DPI aware, so on a scaled display (e.g. 200% on a 4K SR panel) it renders at the
; native resolution instead of being stretched by Windows (required for correct SR weaving)
dpi_aware = 1
; upscale: the game renders at its own resolution (set it to e.g. 1920x1080 in the game: its UI
; stays readable) and the wrapper shows both eyes woven at the panel's native resolution in its own
; window over the game. Display mode switches are blocked so the panel stays native.
upscale = 0
; upscale: a blocked display mode change is reported to the game as done, so it keeps its own
; resolution setting (0 = report the real, unchanged mode)
upscale_report_mode = 1
; the game draws into an off-screen copy of its back buffer and the window only ever receives
; finished (woven) frames. Fixes flicker where Windows shows the back buffer while it is still being
; drawn (Broken Age flashed half-drawn, un-woven frames). 0 = draw into the real back buffer.
virtual_backbuffer = 1
; vsync: -1 = as the game sets it, 0 = off, 1 = on
swap_interval = -1

[Overlay]
; keep separation/convergence on screen (Ctrl+F1 toggles)
show_values = 0
; side by side / top and bottom: the mouse cursor is drawn into each eye (at the screen), and Windows'
; own cursor - which sits in neither half - is hidden over the game. Woven or one eye: Windows draws it
cursor = 1

[Keys]
separation_down = ctrl F3
separation_up = ctrl F4
convergence_down = ctrl F5
convergence_up = ctrl F6
; saves separation, convergence and [ShaderOverride]
save = ctrl F7
toggle = ctrl T
dump_frame = ctrl F12
; SR weaving on/off (off shows SBS)
weave_toggle = ctrl alt W
show_values = ctrl F1
auto_convergence = ctrl F2
; hunting: walk through the shaders drawn on screen (the selected one is hidden) and set each
; to stereo / mono (screen depth) / skip (not drawn); Ctrl+F7 saves the choices
hunt_toggle = ctrl F9
hunt_prev = ctrl F10
hunt_next = ctrl F11
hunt_mode = ctrl F8
; keep these keys from the game (many games react to F5 etc. whatever modifiers are held)
swallow = 1

[Debug]
; 0 = errors only, 1 = normal, 2 = verbose
log_level = 1
; log crashes (faulting module and call stack) to OGL3D.log
log_crashes = 1
; frame numbers to save as OGL3D_frameNNNNN.bmp (both eyes), e.g. 300,1200
dump_frames =
; frame numbers whose draw calls are logged (the frame Ctrl+F12 dumps is traced too)
trace_frames =
; traced frames also save the target of every draw (OGL3D_step<frame>_<draw>.bmp)
trace_steps = 0
; log draw counters every N frames (0 = off)
stats_every = 600
; log frames whose left eye, right eye or composed output differ from both neighbours (flicker),
; with an image sheet OGL3D_flicker_NNNNN.bmp of the three frames
flicker_probe = 0
; paint the back buffer magenta between taking the left eye and composing: anything magenta on
; screen was shown before composition (presentation problem, see virtual_backbuffer)
mark_backbuffer = 0
; save both eyes (OGL3D_frameNNNNN.bmp, up to N times) when the picture turns flat or dark
dump_dark = 0

[ShaderOverride]
; written by hunting mode: <program hash> = stereo | mono | skip
